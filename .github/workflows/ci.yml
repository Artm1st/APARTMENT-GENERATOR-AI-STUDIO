name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - refactor/generative-engine-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: V2 topology tests
        run: npm run test:v2

      - name: Build
        run: npm run build
